<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
    background: linear-gradient(to right,white,gray,black);
    font-family: Arial, sans-serif;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    outline: none;
}

.container{
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card{
    width: 50%;
    height: 80vh;
    background: rgb(109,105,105);
    color: white;
    padding: 1rem;
    border-radius: 10px;
    overflow: auto;
}

.card-title{
    text-align: center;
    font-size: 3rem;
    margin-bottom: 1rem;
}

#input{
    width: 80%;
    padding: 0.5rem;
    border-radius: 10px;
    border: none;
}

.btn{
    width: 18%;
    padding: 0.5rem;
    border: none;
    border-radius: 10px;
    background: dodgerblue;
    color: white;
    cursor: pointer;
}

.btn:hover{
    background: orange;
}

.li{
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgb(70,80,90);
    padding: 0.5rem;
    margin: 1rem 0;
    border-radius: 10px;
}

.btn1{
    background: dodgerblue;
    border: none;
    padding: 0.4rem 0.7rem;
    border-radius: 8px;
    cursor: pointer;
}

.btn1:hover{
    background: orange;
}

i{
    color: red;
}

/* SINGLE MESSAGE BOX */
#mes{
    display: none;
    margin: 0.5rem 0;
    padding: 0.5rem;
    text-align: center;
    border-radius: 8px;
    color: black;
}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous"/>
    <link rel="stylesheet" href="csstodo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to do task</title>
</head>
<body>

<div class="container">
    <div class="card">
        <h1 class="card-title">Todo App</h1>

        <div class="card-body">

            <form class="card-form">
                <input type="text" id="input" placeholder="Enter a todo here" required>
                <button class="btn" type="submit">Add Todo</button>
            </form>

            <p id="mes"></p>
                <p id="mes">  https://aymantamim10409.github.io/Todo-app-/</p>
            <ul id="ul"></ul>

        </div>
    </div>
</div>

<script >
    const cardForm = document.querySelector('.card-form');
const int = document.querySelector('#input');
const ul = document.querySelector('#ul');
const mes = document.querySelector('#mes');

// CREATE TODO
const crateTodo = (id, value) => {

    const li = document.createElement('li');
    li.classList.add("li");
    li.id = id;

    li.innerHTML = `
        <span>${value}</span>
        <span>
            <button class="btn1">
                <i class="fa-solid fa-trash"></i>
            </button>
        </span>
    `;

    ul.appendChild(li);
};

// MESSAGE SYSTEM (GREEN / RED)
const showMes = (text, type) => {

    mes.style.display = "block";
    mes.textContent = text;

    if(type === "green"){
        mes.style.background = "limegreen";
    }

    if(type === "red"){
        mes.style.background = "tomato";
    }

    setTimeout(() => {
        mes.style.display = "none";
    }, 1500);
};

// ADD TODO
const todoAdd = (event) => {

    event.preventDefault();

    const value = int.value.trim();

    if(value === "") return;

    const id = Date.now().toString();

    crateTodo(id, value);

    int.value = "";

    showMes("Todo Created", "green");
};

// DELETE TODO (EVENT DELEGATION)
ul.addEventListener('click', (event) => {

    if(event.target.closest('.btn1')){

        const li = event.target.closest('.li');
        li.remove();

        showMes("Todo Deleted", "r");
    }

});

cardForm.addEventListener("submit", todoAdd);
</script>
</body>
</html>
